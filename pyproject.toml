[project]
name = "archflow"
version = "0.1.0"
description = "Contract-first DSL compiler for AI-generated modular systems."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
archflow = "archflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "compiler"}

[tool.setuptools.packages.find]
where = ["compiler"]
